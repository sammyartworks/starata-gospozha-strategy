<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Старата Госпожа, стратегия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1D3D55;--yolk:#F6DB71;--cream:#F7F1E3;--bordo:#4F7391;--ink:#1C1C1E;--mid:#5E5A55;--paper:#fff;--line:#E6DFD0;
--B:90px;--gap:10px;--outer:18.6vw;--acc:var(--navy);--dark:#14202B;
--tt:.35s cubic-bezier(.4,0,.2,1);--ez:cubic-bezier(.4,0,.2,1);--swoop:cubic-bezier(.6,0,0,1);--enl:cubic-bezier(.65,0,.15,1);
--yeet:calc((max(100vw,100vh) - var(--B)) / -4);
--margin:120px;--gut:24px;--gw:calc(100vw - 60px - 2*var(--margin));--col:calc((var(--gw) - 11*var(--gut))/12);--c2:calc(60px + var(--margin) + var(--col) + var(--gut));
--hd:'Oswald','Arial Narrow',sans-serif;--tx:'Montserrat',Arial,sans-serif;color-scheme:light}
@media (max-width:991px){:root{--B:64px;--gap:5px;--margin:24px;--gw:calc(100vw - 2*var(--margin));--c2:var(--margin)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{background:var(--paper);color:var(--ink);font-family:var(--tx);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3,.ttl{font-family:var(--hd);font-weight:500;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}

/* ===== MOSAIC ===== */
.nav{position:fixed;inset:0;z-index:100;pointer-events:none}
.navc.open .nav{pointer-events:all}
.nwrap{position:absolute;inset:0;transition:background-color .3s var(--ez)}
.navc.open .nwrap{background:var(--paper);transition:background-color .3s var(--ez) .2s}
.nin{position:absolute;inset:var(--gap)}
.nt{position:absolute;padding:calc(var(--gap)/2)}
.t1{left:0;top:0;width:var(--outer);height:100%}
.t2{left:var(--outer);top:0;width:calc(50% - var(--outer) + var(--B)/2);height:calc(50% - var(--B)/2)}
.t3{right:var(--outer);top:0;width:calc(50% - var(--outer) - var(--B)/2);height:calc(50% + var(--B)/2)}
.t4{left:var(--outer);bottom:0;width:calc(50% - var(--outer) - var(--B)/2);height:calc(50% + var(--B)/2)}
.t5{right:var(--outer);bottom:0;width:calc(50% - var(--outer) + var(--B)/2);height:calc(50% - var(--B)/2)}
.t6{right:0;top:0;width:var(--outer);height:100%}
.tile{text-decoration:none;position:relative;display:flex;flex-direction:column;justify-content:space-between;width:100%;height:100%;padding:23px;text-align:left;background:var(--tc);color:var(--tf);overflow:hidden;
 transition:border-radius .35s,padding .35s,color var(--tt),background-color var(--tt)}
.tile *{pointer-events:none}
.t1 .tile{border-radius:8px 0 0 8px}.t6 .tile{border-radius:0 8px 8px 0}
.tile .ttl{display:block;font-size:min(calc(2.75vw - 6px),calc(1.375vw + 15px));line-height:.95;position:relative;top:0;transform-origin:0 50%;max-width:12ch}
.tile .n{font:600 12px/1 var(--tx);letter-spacing:.12em;opacity:.75;margin-bottom:10px;display:block}
.tile .vis{align-self:flex-end;width:min(62%,220px);aspect-ratio:1;transition:opacity .3s ease,transform var(--tt)}
.t1 .vis,.t6 .vis{width:min(92%,240px)}
.tile .vis svg{width:100%;height:100%;overflow:visible}
.tile .sub{font-size:13px;line-height:1.4;font-weight:500;max-width:26ch;opacity:.85;position:absolute;left:23px;bottom:23px;right:45%}
.t1 .sub,.t6 .sub{position:static;margin-top:12px;right:auto}
@media (any-hover:hover){.tile:hover{background-color:var(--ink)!important;color:#fff!important}.tile:hover .vis{transform:scale(1.04)}}
@media (max-height:399px),((max-width:991px) and (max-height:480px)){.tile .vis{display:none}}
/* off-screen state */
.navc:not(.open) .nt{transform:scale(2) translate(var(--tx2),var(--ty2));visibility:hidden;transition:transform .5s var(--swoop),visibility 0s .5s}
.navc.open .nt,.navc.close .nt.enlarge{transform:none;visibility:visible;transition:transform .5s var(--swoop) .1s,visibility 0s}
.t1{--tx2:calc(var(--yeet)*4);--ty2:0px}.t2{--tx2:calc(var(--yeet)*-.1);--ty2:calc(var(--yeet)*1)}.t3{--tx2:calc(var(--yeet)*-1);--ty2:calc(var(--yeet)*-.1)}
.t4{--tx2:calc(var(--yeet)*1);--ty2:calc(var(--yeet)*.1)}.t5{--tx2:calc(var(--yeet)*.1);--ty2:calc(var(--yeet)*-1)}.t6{--tx2:calc(var(--yeet)*-4);--ty2:0px}
/* enlarge */
.navc.close .nt:not(.enlarge){opacity:0;transition:.2s ease}
.nt.enlarge{z-index:99;width:100vw!important;height:100vh!important;transition:.6s var(--enl)!important;margin:calc(-1*var(--gap))}
.t1.enlarge,.t2.enlarge,.t3.enlarge,.t6.enlarge{top:0!important;bottom:auto}.t4.enlarge,.t5.enlarge{bottom:0!important;top:auto}
.t1.enlarge,.t2.enlarge,.t4.enlarge{left:0!important;right:auto}.t3.enlarge,.t5.enlarge,.t6.enlarge{right:0!important;left:auto}
.nt.enlarge .tile{background-color:#14202B!important;color:#fff!important;border-radius:0}
.nt.enlarge .vis,.nt.enlarge .sub,.nt.enlarge .n{opacity:0}.nt.enlarge .ttl{max-width:none;white-space:nowrap}
.navc.close .nt.enlarge .ttl{transform:var(--tt2);transition:transform .6s var(--ez)}
.navc.snap .nt{transition:none!important}
/* centre button */
.menu{position:fixed;z-index:101;width:var(--B);height:var(--B);left:calc(50% - var(--B)/2);top:calc(50% - var(--B)/2);transition:transform .5s var(--swoop)}
.mbtn{width:100%;height:100%;background:var(--acc);color:#fff;display:grid;place-items:center;position:relative;transition:transform .3s}
.mbtn i{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .3s cubic-bezier(.25,0,.25,1),transform .3s cubic-bezier(.25,0,.25,1)}
.mbtn .mono{font:600 calc(var(--B)*.34)/1 var(--hd);letter-spacing:.02em}
.mbtn svg{width:42%;height:42%;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round}
.ic-x,.ic-h{opacity:0;transform:scale(.8)}
body.inch .navc:not(.open) .menu{transform:translate(calc(-50vw + var(--B)/2 - var(--B)/6),0) scale(.666667)}
body.inch .navc:not(.open) .ic-mono{opacity:0;transform:scale(.8)}body.inch .navc:not(.open) .ic-h{opacity:1;transform:none}
@media (any-hover:hover){body.inch .navc:not(.open) .menu:hover .ic-h{opacity:0;transform:scale(.8)}body.inch .navc:not(.open) .menu:hover .ic-mono{opacity:1;transform:none}}
body.inch .navc.open .ic-mono{opacity:0}body.inch .navc.open .ic-x{opacity:1;transform:none}
.navc.warp.open .mbtn{animation:bo .4s linear .1s}
@keyframes bo{20%{transform:scale(2,.7)}40%{transform:scale(1.2,.82)}60%{transform:scale(1,.93)}75%{transform:scale(.98,.97)}90%{transform:scale(.99)}100%{transform:none}}
/* intro */
.intro{position:fixed;z-index:102;left:50%;top:50%;width:min(720px,calc(min(100vw,100vh) - 64px));aspect-ratio:1;transform:translate(-50%,-50%);background:var(--acc);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,4vw,48px);transition:width .9s cubic-bezier(.5,0,.05,1),opacity .3s ease .7s,padding .9s}
.intro p{font:600 13px/1.2 var(--tx);letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.intro h1{font-size:clamp(40px,6vw,80px);line-height:1}
.intro .go{align-self:flex-end;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.intro.out{width:var(--B);padding:0;opacity:0}.intro.out>*{opacity:0;transition:opacity .2s}

/* ===== CHAPTER ===== */
.rail{position:fixed;left:0;top:0;bottom:0;width:60px;z-index:90;background:var(--dark);color:#fff;transition:background-color .3s}
.rail.on-light{color:var(--ink)}
.rail .rt{position:absolute;top:16px;left:50%;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:500 13px/1 var(--tx);white-space:nowrap;transition:opacity .3s}
.rail .pr{position:absolute;right:0;top:0;width:3px;height:100%;background:var(--acc);transform-origin:top;transform:scaleY(0)}
.rail:after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18)}.rail.on-light:after{background:var(--line)}
main{padding-left:60px}
.ch{--hl:rgba(255,255,255,.16)}
.hero{position:relative;height:100svh;background:var(--dark);color:#fff;overflow:hidden}
.hero .hl{position:absolute;left:0;right:0;height:1px;background:var(--hl)}.hero .vl{position:absolute;top:0;bottom:0;width:1px;background:var(--hl)}
.hero .hl,.hero .vl,.hero .ob{transition:transform .7s cubic-bezier(.6,0,.6,1),opacity .7s cubic-bezier(.6,0,.6,1),background-color .3s ease-in-out}
.hero .hl{transform-origin:left}.hero .vl{transform-origin:top}
.hero.ld .hl{transform:scaleX(0)}.hero.ld .vl{transform:scaleY(0)}.hero.ld .ob{transform:scale(.9);opacity:0}
.hero h1{position:absolute;left:calc(var(--c2) - 60px);bottom:50%;font-size:clamp(0px,9vw,180px);line-height:1;white-space:nowrap}
.hero .k{position:absolute;left:calc(var(--c2) - 60px);top:calc(50% + 22px);font:500 12px/20px var(--tx);color:var(--yolk);letter-spacing:.06em;display:flex;gap:18px}
.hero .ob{position:absolute;width:var(--s);height:var(--s);background:var(--bg);display:grid;place-items:center}
.hero .ob i{width:62%;height:62%;border-radius:40%;background:var(--fg)}
.hero .ob.big{padding:6%}.hero .ob.big svg{width:100%;height:100%}
.stmt{background:var(--tc);color:var(--tf);padding:clamp(120px,22vh,240px) var(--margin) clamp(120px,22vh,240px) calc(var(--c2) - 60px)}
.stmt h2{font-size:clamp(44px,6.4vw,104px);line-height:1.02;max-width:14ch}
.stmt h2 .o{color:transparent;-webkit-text-stroke:2px var(--tf)}
.stmt h2 .chip{display:inline-block;width:.62em;height:.62em;vertical-align:.04em;background:var(--tf);border-radius:4px;margin:0 .1em;position:relative}
.stmt h2 .chip:after{content:'';position:absolute;inset:18%;border-radius:40%;background:var(--tc)}
.stmt p{font:500 18px/28px var(--tx);margin-top:32px;max-width:42ch;opacity:.9}
.sec{position:relative;padding:clamp(80px,14vh,140px) var(--margin) clamp(80px,14vh,140px) calc(var(--c2) - 60px);border-top:1px solid var(--line);scroll-margin-top:0}
.sec:before{content:'';position:absolute;top:0;bottom:0;left:calc(var(--c2) - 60px - 1px);width:1px;background:var(--line)}
.sec .an{font:500 12px/20px var(--tx);color:var(--acc);letter-spacing:.04em;margin-bottom:18px;display:block}
.sec h2{font-size:clamp(36px,4.2vw,60px);max-width:18ch;color:var(--ink)}
.sec .ln{font:400 18px/28px var(--tx);color:var(--mid);max-width:46ch;margin-top:20px}
.sec .bg{font:500 clamp(80px,11vw,180px)/.9 var(--hd);color:var(--hc);letter-spacing:-.03em;margin-bottom:16px}
.pil{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;margin-top:44px;border-top:1px solid var(--ink)}
.pil div{padding:22px 24px 6px 0;border-right:1px solid var(--line);margin-right:24px}
.pil div:last-child{border-right:0}
.pil b{display:block;font:500 30px/1 var(--hd);color:var(--hc);margin-bottom:12px}
.pil p{font:500 18px/26px var(--tx)}
.md{margin-top:48px;display:grid;gap:10px}
.md .f{position:relative;overflow:hidden;background:var(--cream);min-height:220px}
.md .f span{position:absolute;left:0;bottom:0;background:var(--acc);color:#fff;font:500 12px/20px var(--tx);padding:4px 10px}
.m1 .f{height:min(70vh,640px)}.m2{grid-template-columns:1fr 1fr}.m2 .f{height:min(60vh,520px)}.m3{grid-template-columns:repeat(3,1fr)}.m3 .f{height:min(56vh,480px)}
.m4{grid-template-columns:repeat(4,1fr)}.m4 .f{height:300px}.m5{grid-template-columns:repeat(5,1fr)}.m5 .f{height:min(46vh,400px)}
.m6{grid-template-columns:repeat(6,1fr)}.m6 .f{height:240px}.m8{grid-template-columns:repeat(4,1fr)}.m8 .f{height:200px}
.scat{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:24px;margin-top:56px}
.scat .f{height:260px;transform:rotate(var(--r));box-shadow:0 10px 30px rgba(0,0,0,.12)}.scat .f:nth-child(even){margin-top:40px}
.av{grid-template-columns:repeat(6,1fr);gap:24px}.av div{text-align:center;font-size:14px;font-weight:600}.av .lc{display:block;aspect-ratio:1;border-radius:50%;overflow:hidden;margin-bottom:12px;box-shadow:inset 0 0 0 1px rgba(28,28,30,.12);background:#fff}.av img{width:100%;height:100%;object-fit:cover;position:relative;z-index:-1}.av .lc{position:relative;isolation:isolate;display:grid;place-items:center}.av img.ct{object-fit:contain;position:static;z-index:auto}
.logos{display:flex;flex-wrap:wrap;gap:40px 64px;align-items:center;padding:48px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.logos img{height:48px;width:auto;object-fit:contain}
.qs p{font:500 clamp(30px,3.4vw,52px)/1.1 var(--hd);letter-spacing:-.02em;padding:26px 0;border-bottom:1px solid var(--line)}.qs p:first-child{border-top:1px solid var(--ink)}
.sw{display:flex;margin-top:32px}.sw i{width:120px;height:80px}.sw i:first-child{border-radius:8px 0 0 8px}.sw i:last-child{border-radius:0 8px 8px 0}
.budget .row{display:flex;height:120px;font:500 32px/1 var(--hd)}.budget .row div{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}.budget img{width:32px;height:32px;object-fit:contain}
.tl{grid-template-columns:repeat(3,1fr);gap:0}.tl div{padding:28px;min-height:260px;display:flex;flex-direction:column;gap:14px}.tl b{font:500 44px/1 var(--hd)}.tl p{font-size:18px;line-height:28px}
.steps{grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}.steps div{padding:24px 24px 24px 0;border-right:1px solid var(--line);margin-right:24px}.steps div:last-of-type{border:0}
.steps span{font:500 30px/1 var(--hd);color:var(--acc)}.steps b{display:block;font:500 30px/1.1 var(--hd);margin:12px 0}.steps p{font-size:18px;line-height:28px}
.ph{background:var(--yolk);padding:2px 8px;font-weight:700}
.nx{text-decoration:none;display:block;width:100%;text-align:left;background:var(--tc);color:var(--tf);padding:clamp(80px,16vh,160px) var(--margin) clamp(80px,16vh,160px) calc(var(--c2) - 60px);transition:background-color var(--tt),color var(--tt);position:relative;overflow:hidden}
.nx small{display:block;font:500 12px/20px var(--tx);letter-spacing:.06em;margin-bottom:18px}
.nx h2{font-size:clamp(48px,7vw,120px);line-height:1}
.nx .vis{position:absolute;right:var(--margin);top:50%;width:min(28vw,320px);aspect-ratio:1;transform:translateY(-50%)}
@media (any-hover:hover){.nx:hover{background:var(--ink);color:#fff}}
.os{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc((1 - var(--op,0))*80px));opacity:var(--op,0);z-index:80;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:30px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:991px){
 .t1{left:0;top:0;width:45%;height:26%}.t2{left:auto;right:0;top:0;width:55%;height:26%}
 .t3{left:0;right:auto;top:26%;width:calc(50% + var(--B)/2);height:calc(37% - var(--B)/2)}
 .t4{left:auto;right:0;bottom:auto;top:26%;width:calc(50% - var(--B)/2);height:calc(37% + var(--B)/2)}
 .t5{left:0;right:auto;bottom:0;width:calc(50% - var(--B)/2);height:calc(37% + var(--B)/2)}
 .t6{left:auto;right:0;top:auto;bottom:0;width:calc(50% + var(--B)/2);height:calc(37% - var(--B)/2)}
 .menu{top:calc(26% + 37% - var(--B)/2 + var(--gap)/2)}
 .t1 .tile{border-radius:8px 0 0 0}.t2 .tile{border-radius:0 8px 0 0}.t5 .tile{border-radius:0 0 0 8px}.t6 .tile{border-radius:0 0 8px 0}
 .tile{padding:14px}.tile .ttl{display:block;font-size:20px}.tile .sub{display:none}.tile .vis{width:min(56%,110px)}.t1 .vis,.t6 .vis{width:min(56%,110px)}
 main{padding-left:0;padding-bottom:56px}
 .rail{top:auto;width:auto;right:0;height:56px}.rail .rt{writing-mode:horizontal-tb;transform:none;top:auto;left:16px;bottom:20px}.rail .pr{width:100%;height:3px;top:0;transform-origin:left;transform:scaleX(0)}.rail:after{display:none}
 body.inch .navc:not(.open) .menu{top:auto;bottom:calc(var(--B)/-8);transform:scale(.75)}
 .hero h1{left:var(--margin);font-size:clamp(36px,12vw,96px);white-space:normal;max-width:90vw}.hero .k{left:var(--margin)}
 .stmt,.sec,.nx{padding-left:var(--margin);padding-right:var(--margin)}.sec:before{display:none}
 .m2,.m3,.m4,.m5,.m6,.m8,.av,.tl,.steps{grid-template-columns:1fr 1fr}.m1 .f,.m2 .f,.m3 .f,.m5 .f{height:240px}
 .pil div{border-right:0;margin-right:0} .scat{grid-template-columns:repeat(3,1fr)}.scat .f{height:160px}
 .nx .vis{width:90px;top:24px;transform:none;right:16px}
 .stmt h2 .o{-webkit-text-stroke:1.5px var(--tf)}
}

/* readability + crisp photos */
.sec .an{font-size:15px;line-height:22px;font-weight:600;letter-spacing:.03em}
.sec .ln{font-size:clamp(20px,1.55vw,24px);line-height:1.45;color:#2E3A44;max-width:50ch;margin-top:22px}
.pil{margin-top:48px}
.pil div{padding:24px 32px 8px 0;min-width:0}
.pil b{font-size:38px;margin-bottom:14px}
.pil p{font-size:clamp(19px,1.45vw,22px);line-height:1.4;color:var(--ink);overflow-wrap:break-word}
.m2:has(img[src*="site_"]){max-width:820px}
.m2:has(img[src*="site_"]) .f{height:auto;aspect-ratio:760/385}
.m1:has(img[src*="h_genz"]) .f{height:auto;aspect-ratio:1500/553}
@media (max-width:991px){.sec .ln{font-size:19px}.pil p{font-size:18px}.pil b{font-size:32px}.sec .an{font-size:14px}}

/* issue #2: по-четливи текстове */
.yi{font-family:'Oswald','Montserrat',Arial,'Helvetica Neue',Helvetica,sans-serif}
.tile .sub .yi{font-family:'Montserrat',Arial,'Helvetica Neue',Helvetica,sans-serif}
.stmt p{font-size:clamp(20px,1.6vw,24px);line-height:1.5;opacity:1;font-weight:500;max-width:46ch}
.sec .ln{color:#1C1C1E;font-weight:500}
.sec .an{font-size:17px;line-height:24px;font-weight:700;letter-spacing:.02em;color:var(--navy)}
.hero .k{font-size:15px;line-height:22px;font-weight:600}
.nx small{font-size:15px;font-weight:600}
.tile .n{font-size:14px;opacity:.9}
.md .f span{font-size:15px;line-height:22px;padding:6px 12px;font-weight:600}
.pil div{padding:26px 32px 14px 0}
.pil p{font-size:clamp(19px,1.45vw,22px);line-height:1.55}
.pil p strong{font-weight:700}
.pil h3{font:500 clamp(24px,2vw,30px)/1.15 var(--hd);color:var(--ink);margin-bottom:10px}
.steps p,.tl p{font-size:19px;line-height:1.55}
.acc{margin-top:36px;background:var(--yolk);color:var(--navy);font:600 clamp(19px,1.45vw,22px)/1.5 var(--tx);padding:20px 24px;border-left:6px solid var(--navy);max-width:62ch}
.sec .bg{overflow-wrap:anywhere}
.sec h2,.nx h2,.hero h1,.stmt h2{overflow-wrap:break-word;hyphens:manual}
/* двете локации: веднъж, по-големи, без разтегляне */
.md.sites{max-width:none!important;grid-template-columns:1fr 1fr}
.md.sites .f{height:auto!important;aspect-ratio:760/385;min-height:0}
/* трейлър: всички кадри, цели */
.md.frames{grid-template-columns:repeat(3,1fr);gap:12px}
.md.frames .f{height:auto;aspect-ratio:752/564;min-height:0}
/* сторибордове: големи, кадрите цели */
.md.boards{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.md.boards .f{height:auto;min-height:0;background:none;flex:0 1 auto;max-width:100%}
.md.boards img{width:auto;height:auto;max-width:100%;max-height:440px}
/* мудборд: по 3 на ред */
.md.mood{grid-template-columns:repeat(3,1fr);gap:12px}
.md.mood .f{height:auto;aspect-ratio:2/3;min-height:0}
/* кастинг */
.sub2{font:600 17px/24px var(--tx);color:var(--navy);margin-top:44px;letter-spacing:.02em}
.md.castg{grid-template-columns:repeat(4,1fr);gap:20px;margin-top:16px}
.castg figure,.refs figure{margin:0}.castg img{aspect-ratio:1;height:auto;border-radius:6px}
.castg figcaption,.refs figcaption{font:600 17px/24px var(--tx);margin-top:8px}
.ladies{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.ladies span{background:var(--cream);border:1px solid var(--line);border-radius:30px;padding:10px 18px;font:600 18px/1 var(--tx)}
.md.refs{grid-template-columns:repeat(3,1fr);gap:20px;margin-top:16px;max-width:820px}
.refs img{aspect-ratio:394/700;height:auto;border-radius:6px}
/* одобреното: трейлър + 9 идеи със снимки */
.trl{display:grid;grid-template-columns:2fr 1fr;margin-top:48px;background:var(--dark);color:#fff;text-decoration:none;overflow:hidden;border-radius:6px}
.trl .tp{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.trl .tp img{aspect-ratio:3/4;height:auto}
.trl .tt{padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.trl small{font:600 15px/1 var(--tx);color:var(--yolk);letter-spacing:.04em}.trl b{font:500 clamp(36px,4vw,56px)/1 var(--hd)}.trl em{font:600 17px/1 var(--tx);font-style:normal;background:var(--yolk);color:var(--navy);padding:12px 16px;align-self:flex-start;border-radius:30px}
.md.ideas{grid-template-columns:repeat(3,1fr);gap:20px}
.ideas figure{margin:0;background:var(--cream)}.ideas img{aspect-ratio:4/3;height:auto}
.ideas figcaption{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px}
.ideas b{font:500 22px/1 var(--hd);color:var(--navy)}.ideas span{font:600 19px/1.35 var(--tx)}.ideas small{font:500 16px/1.4 var(--tx);color:#3A4650}
/* плочка 03: текстът да не се реже */
.t3 .tile .sub{right:38%;max-width:30ch}
@media (max-width:991px){
 .sec .ln{font-size:19px}.stmt p{font-size:19px}.sec .an{font-size:16px}.pil p{font-size:18px}

 .sec .bg{font-size:clamp(48px,15vw,96px)}
 .nx h2{font-size:clamp(36px,11vw,64px)}

 .md.sites{grid-template-columns:1fr}
 .md.frames,.md.mood,.md.castg{grid-template-columns:1fr 1fr}
 .md.ideas,.md.tl{grid-template-columns:1fr}.tl div{min-height:0}
 .md.refs{grid-template-columns:repeat(3,1fr);gap:10px}

 .acc{font-size:18px}

 {id:'tone',t:'Тонът',h:'Мила, но строга. Има мнение за всяка чиния',ln:'Сега сайтът пише „Мястото за изкусително вкусни ястия“. Госпожата би казала „Седни, изяж си бухтите и чуй какво ти казвам.“',p:['Хуморът е винаги на страната на госта: шегуваме се с него, никога срещу него.','При оплакване за храна, здраве или пари шегата спира.','Едно емоджи стига: повече правят текста да изглежда евтин.','Политиката остава извън масата: не коментираме избори, партии и новини с политика.'],o:['tone']},
 {id:'reveal',t:'Разкриването',h:'Госпожата се показва на части',ln:'През първите 90 дни никой не вижда лицето ѝ. Показваме само ръката ѝ, перлите, червилото и чуваме гласа ѝ. Така хората започват да се питат коя е, а интересът расте.',p:[['Етап 1, загадката.','Първите седмици тя само оставя следи: бележки с нейния почерк по масите, силует зад вратата, ръка с перли в кадъра. Никой не знае коя е.'],['Етап 2, присъствието.','Тя вече е част от деня в заведението, без да я виждаме. До сметката гостът намира картичка с нейна реплика. В сторита показваме нейна бележка до кухнята, например „Днес бухти със сладко от вишни“, и шефът приготвя точно това: така представяме ястието на деня. Тя подготвя малки изненади за редовните гости и ги кани на събития.'],['Етап 3, голямото запознанство.','След 90 дни показваме коя е: видео, в което виждаме лицето ѝ, и среща с гостите на живо в заведението.']],wide:1,o:['reveal']},
 {id:'vision',t:'Визията',h:'Стара София през днешен обектив',ln:'Снимаме съвременно, с естествена светлина, истинска храна и истински хора. В кадъра има малки следи от Госпожата: перли, бележка, ръкавица.',p:['На Оборище снимаме детайли отблизо и текстури, а цветът на адреса е синьо.','На Витоша снимаме широки кадри с хора и движение, а цветът на адреса е жълто.'],sw:1,o:['vision']}]},
{id:'concept',t:'Трите фокуса',c:'Госпожата събира всички.',cards:[['Един профил','Двата профила стават един, а трейлърът „Завръщането“ връща Госпожата у дома.'],['Клубът на пенсионера','Клубна карта за редовните гости, с която всяко посещение носи печат и награди.'],['Кетърингът','Брънч с доставка до офиси, партита и домове.']],d:'Обединяваме двата профила в един, връщаме Госпожата у дома с трейлър, пускаме Клуба на пенсионера за редовните гости и кетъринга за офисите.',tc:'#C9D6E0',th:'#B6C7D4',tf:'#1D3D55',hc:'#1D3D55',g:'card',s:[
 {id:'merge',t:'Защо сливаме',h:'Всички гости на една маса',ln:'Страниците на Оборище и Витоша в Instagram и Facebook се сливат. Остават едни последователи, едно име и един рекламен бюджет.',p:[['Всеки адрес има свой цвят.','Постовете за Оборище са със син етикет, а за Витоша с жълт. Така в един общ профил веднага се вижда за кое място е постът.'],['Локацията е отбелязана.','Всеки пост има геотаг (отбелязаното място в Instagram) и адреса на първия ред. Гостът знае къде да отиде. Биото на профила съдържа и двата адреса.'],['Highlights за всяка локация.','Най-горе в профила има Highlights (запазени сторита). Отделен за Оборище и за Витоша, с адреса, работното време и снимки от мястото, плюс Меню, Кетъринг и Клубът. Новият последовател намира всичко за секунди.']],o:['merge']},
 {id:'comeback',t:'Трейлърът',h:'Старата Госпожа се връща',ln:'Кратко видео, с което обявяваме, че двата профила стават един. Вместо скучно съобщение показваме как Госпожата се завръща у дома. Тя пристига с ретро автомобил, а лицето ѝ остава скрито.',p:[['Форматът.','Видео от 20 до 25 секунди, вертикално за Reels и TikTok, плюс версия за постове. Без говор, само музика и забавени кадри.'],['Мястото.','Колата спира пред Оборище 18, където е започнало всичко през 2018. Виждаме ръкавицата, перлите, токчетата и червилото, но не и лицето.'],['Финалът.','Тя сяда на масата и на екрана излиза „Най-хубаво е у дома.“ Посланието е, че Госпожата вече живее на едно място, в общия профил.']],wide:1,o:['comeback']},
 {id:'announce',t:'Анонсът',h:'Обединяването става голямо завръщане',ln:'Всичко ново у Госпожата излиза наведнъж, в една обща новина.',p:[['5 дни преди: тийзъри.','Пускаме три снимки със следи от Госпожата (бележка, перли, чаша с червило) без обяснение. Хората се питат какво предстои.'],['Денят на сливането.','Пускаме трейлъра „Завръщането“, кратък забавен скеч, в който тя сдобрява двете сестри Оборище и Витоша, и пост с няколко снимки „Какво се променя и какво остава“.'],['Томбола „Брънч за двама с Госпожата“.','4 седмици, всяка седмица една награда. Условието е да последваш новия профил и да отбележиш приятел в коментар. Носи и нови последователи, не само преминаване от стария профил.']],big:'Декември',o:['announce']},
 {id:'club',t:'Клубът на пенсионера',h:'Внуците трупат стаж. Госпожата ги пенсионира.',ln:'Клубната карта е като старата трудова книжка. Всяка сметка носи печат, всеки печат е стаж. Натрупаш ли стаж, Госпожата те пенсионира, а пенсията идва с привилегии.',p:[['Стаж.','Записваш се с QR код на масата и получаваш бухтички за добре дошли. Всяка сметка носи печат, а на всеки 8 печата кафето е от Госпожата.'],['Ранно пенсиониране, след 10 печата.','Изненада за рождения ден, пръв опитваш новите ястия и имаш отстъпка за кетъринг. След 25 печата ставаш <strong>Почетен пенсионер</strong>: маса без опашка, покана за дегустация и името ти на стената.'],['Истинските пенсионери.','Гостите над 65 години не трупат печати отначало. Получават картата направо на ниво Ранно пенсиониране, с постоянна отстъпка.']],o:['club','levels']},
 {id:'clubhow',t:'Стартът на Клуба на пенсионера',h:'Клубът на пенсионера отваря врати',ln:'През декември пускаме тийзър, после две седмици правим тих старт с редовните гости, а през януари клубът отваря за всички.',p:['Първите две седмици клубът работи тихо, само с редовните гости и екипа, за да изчистим грешките преди публичния старт.','Публичният старт през януари е със събитието „Доведи баба си“: всеки, който дойде с баба си, получава отстъпка и снимка.','Първите 100 записани получават по два печата на сметка, за да стигнат по-бързо до първата награда.'],big:'Януари',o:['clubhow']},
 {id:'catering',t:'Кетърингът',h:'Брънчът ѝ тръгва на път',ln:'Кетърингът е брънч, който доставяме до офиси, фирмени партита и домове. Пускаме го с две рекламни кампании: в края на ноември за офисите и после за семейните празници.',p:[['Кампания 1, за офисите (края на ноември).','Видео: скучна среща в офис, всички гледат таблици. Вратата се отваря, влиза Госпожата с поднос брънч и казва „Срещата ще я забравите. Бухтите едва ли.“ Всички сядат на една маса. Посланието към фирмите: поръчайте ни за следващата си среща.'],['Кампания 2, семейните празници.','„Оставете тенджерите. Брънчът пристига.“ Брънч с доставка у дома за рождени дни и семейни празници.']],o:['catering','cater2']},
 {id:'caterextra',t:'Пакетите',h:'Госпожата идва на гости',ln:'Вместо меню на бройка предлагаме три готови пакета за различни поводи. Готовият пакет се избира и поръчва по-лесно, особено от офис.',p:[['Трите пакета.','„Срещата в 9:00“: мини Бенедикт, мини кроасан с прошуто, мини бухти. „Обяд у Госпожата“: мини бургер, мини кубински сандвич, мини кюфтенца, мини чийзкейк. „Сладката кутия“: мини бухти с шоколад и със сладко, мини кроасан с плодове.'],['Цената.','Всяка хапка струва от 1 до 4 €, по сегашното кетъринг меню на ресторанта. Точните цени на пакетите потвърждаваме с ресторанта.'],['Как се поръчва.','Рекламата в Instagram, Facebook и TikTok има вградена форма. Човекът попълва повода, датата, броя гости и телефон, без да излиза от приложението. Ресторантът му се обажда.']],big:'3 пакета',o:['caterextra','adscater']}]},
{id:'social',t:'Съдържание',c:'Разказваме истории.<br>Чиниите са доказателството.',d:'Разказваме за Госпожата в пет постоянни рубрики и в TikTok, а гостите сами снимат и я тагват, защото им даваме повод.',tc:'#F7F1E3',th:'#EFE3C8',tf:'#1D3D55',hc:'#1D3D55',g:'lips',s:[
 {id:'content',t:'Рубриките',h:'Разказваме истории',ln:'Всяка рубрика се повтаря всяка седмица. До тях вървят серии с Госпожата, в които лицето ѝ не влиза в кадър.',p:['Пет рубрики се повтарят всяка седмица: менюто, мненията на Госпожата, денят в заведението, кухнята и посрещанията.','Всеки месец публикуваме 10 поста в Instagram и Facebook и 6 видеа в TikTok, колкото е обемът по договора.','Всеки ден пускаме по 2 до 3 сторита за всеки адрес, за да е профилът жив.'],big:'5 рубрики',o:['content']},
 {id:'tiktok',t:'TikTok',h:'Там са младите гости',ln:'През първите два месеца TikTok взима половината от усилията и от рекламния бюджет.',p:['Всеки месец правим 6 видеа за TikTok: кратки сцени с Госпожата, ASMR с храна, тренд формати през нейния поглед.','Водещата серия е „Госпожата срещу Gen Z“: тя коментира модните думи на младите.','Spark Ads: плащаме да покажем на повече хора около двата адреса наше видео, което вече се харесва.'],big:'50%',o:['tiktok']},
 {id:'genz',t:'Госпожата срещу Gen Z',h:'Госпожата срещу Gen Z',ln:'Gen Z: „Това място е so aesthetic.“ Госпожата: „Хубаво е. И храната става.“',o:['genz']},
 {id:'tags',t:'Тагове',h:'Моменти, които хората сами искат да споделят',ln:'Искаме гостите сами да снимат и да тагват Госпожата. Награждаваме само за таг в стори. Отзивите в Google остават доброволни, защото Google забранява награда срещу отзив.',p:[['Карта за изтриване.','След сметката гостът получава малка карта, като лотарийна. Тагне ли Госпожата в стори, изтрива картата и печели кафе, лимонада или отстъпка за следващия път.'],['„Госпожата видя“.','Рубрика, в която всяка седмица споделяме в профила най-хубавите снимки и сторита на гостите, с коментар от Госпожата. Гостът се вижда в официалния профил и има повод да снима пак.'],['Детайли в залата.','Малки детайли в залата, които карат хората да снимат: огледало с надпис „Госпожата одобрява отражението“ и табелка „Тук седят любимите гости на Госпожата“.']],o:['tags']}]},

 {id:'ads',t:'Рекламата',h:'2 000 € на месец, разделени на две равни половини',ln:'Бюджетът се дели по равно: половината за TikTok, половината за Instagram и Facebook.',p:['Ресторантите и кетърингът делят бюджета по равно, по 1 000 € на месец.'],md:{budget:1},o:['ads'],ex:1},
 {id:'days',t:'90 дни',h:'Първите 90 дни',ln:'Ноември полага основата, декември Госпожата проговаря, януари интересът става навик.',wide:1,o:['days']},
 {id:'kpi',t:'Как мерим',h:'Какво искаме да видим след 90 дни',ln:'',p:[['Един профил','Колко от последователите на двата стари профила са минали в общия.'],['Кетъринг','Колко запитвания идват, колко струва всяко от рекламата и колко от тях стават поръчки.'],['Отзиви','Отговор на всеки отзив в Google и TripAdvisor до 24 часа. Витоша в Google от 3,8 към 4,0.']],o:['kpi']},
 {id:'fixfirst',t:'Първо вкъщи',h:'Първо ред вкъщи, после гости',ln:'Рекламата ускорява и доброто, и лошото, затова първо оправяме слабите места.',p:[['Опашки през уикенда','Кафе на опашката, „Колко чакаме сега“ в сторита, пренасочване към Витоша.'],['„Скъпо“ в отзивите','Показваме защо струва: грамаж, домашно, ръката на шефа. Обедното меню е входният билет.'],['Сайтът','На страницата на Витоша адресът е 456 вместо 119, в менюто има правописни грешки, а едно и също ястие има различна рецепта и цена на двата адреса.']],o:['fixfirst']},
 {id:'annex',t:'С анекс',h:'Какво е извън договора и може да влезе с анекс',ln:'Силни следващи стъпки, всяка с отделна цена или отделен бюджет.',p:[['Реклама в Google','Реклама за „кетъринг за офис“, „брънч кетъринг“ и „брънч София“, с отделен бюджет над договорените 2 000 €.'],['Реклами с цел продажби','Сайтът с онлайн поръчки го има. Разширението е допълнителен рекламен бюджет за кампании, които водят хората директно до поръчка в сайта, отделно от 2 000 € за Meta и TikTok.'],['Актриса за Госпожата','Ако за разкриването се наеме актриса с хонорар над 50 € на снимачен ден, това става с писмено одобрение и се плаща отделно.']],o:['annex']}]},

 {id:'boards',t:'Сторибордове',h:'Референцията и нашата версия',ln:'',p:['Сторибордовете са подредени по адрес: общи, за Оборище, за Витоша и за кетъринга.','Това е банка с идеи за следващите месеци, не всичко се снима веднага.'],wide:1,o:['boards']},
 {id:'board',t:'Мудборд',h:'Настроението, което търсим',ln:'',wide:1,o:['board']},
 {id:'cast',t:'Кастинг',h:'Хората пред камерата',ln:'Госпожата остава без лице, затова пред камерата са приятелките ѝ и младите гости. Моделите получават до 50 € на снимачен ден по договора.',p:['Приятелките на Госпожата са 10 подбрани дами над 65.','Младите гости са 11 предложени момичета от 22 до 28.',['Допълнително предложение: Privilege App','Софийско приложение, което свързва създатели на съдържание със заведения. Оферта: брънч за двама срещу Reel и 3 стори с таг на Госпожата.']],o:['cast']},
 {id:'next',t:'Следващи стъпки',h:'Какво правим от утре',ln:'След срещата има три пътя. Който и да изберете, отговаряме до два работни дни.',wide:1,md:{steps:[['Одобрявате','Започваме подготовката на ноември: снимачен ден, кетъринг пакетите и тийзъра.'],['Промени','Отбелязвате точките, връщаме нова версия до два работни дни.'],['Следваща среща','Насрочваме среща от 30 минути, за да изясним отворените въпроси.']]},o:['end']}]}];


const esc=s=>s.replace(/&(?!amp;)/g,'&amp;');
const nbsp=s=>s.replace(/ (\S+)$/,'&nbsp;$1');
/* mosaic */
document.getElementById('nin').innerHTML=CH.map((c,i)=>`<div class="nt t${i+1}" data-i="${i}"><a class="tile" href="#/${c.id}" data-go="${c.id}" style="--tc:${c.tc};--tf:${c.tf}"><div><span class="n">0${i+1}</span><span class="ttl">${c.t}</span>${i===0||i===5?`<p class="sub">${c.c}</p>`:''}</div><div class="vis">${gi(c.id)}</div>${i!==0&&i!==5?`<p class="sub">${c.c}</p>`:''}</a></div>`).join('');
/* chapters */
const media=s=>{const m=s.md;if(!m)return '';
 if(m.logos)return `<div class="md logos">${m.logos.map(l=>`<img src="${I(l)}" alt="">`).join('')}</div>`;
 if(m.av)return `<div class="md av">${m.av.map(([i,n])=>`<div><span class="lc"><img src="${I(i)}" alt="Профилна снимка, ${esc(n)}"></span>${esc(n)}</div>`).join('')}</div>`;
 if(m.cast)return `<p class="sub2">Младите гости: 11 момичета от 22 до 28</p><div class="md castg">${GIRLS.map(([f,n])=>`<figure><img loading="lazy" src="${I('cast_'+f+'.jpg')}" alt="Профилна снимка, ${n}"><figcaption>${n}</figcaption></figure>`).join('')}</div><p class="sub2">Приятелките: 10 дами над 65</p><div class="ladies">${LADIES.map(n=>`<span>${n}</span>`).join('')}</div><p class="sub2">Референции за модели и баби</p><div class="md refs">${REFS.map(([i,c])=>`<figure><img loading="lazy" src="${I(i)}" alt="${c}"><figcaption>${c}</figcaption></figure>`).join('')}</div>`;
 if(m.ideas)return `<div class="md ideas">${IDEAS.map(([i,t,d],k)=>`<figure><img loading="lazy" src="${I(i)}" alt=""><figcaption><b>0${k+1}</b><span>${t}</span><small>${d}</small></figcaption></figure>`).join('')}</div><p class="sub2">Героинята според екипа</p><div class="ladies tv">${TEAMVIEW.map(n=>`<span>${n}</span>`).join('')}</div>`;
 if(m.qs)return `<div class="md qs">${m.qs.map(q=>`<p>${q}</p>`).join('')}</div>`;
 if(m.budget)return `<div class="md budget"><div class="row"><div style="background:#1C1C1E;color:#fff"><img src="${I('logo_tiktok.svg')}" alt="">1 000 €</div><div style="background:#1D3D55;color:#fff"><img src="${I('logo_meta.svg')}" alt="">1 000 €</div></div><div class="row" style="height:72px;font-size:22px"><div style="background:#F6DB71">Ресторанти 50%</div><div style="background:#4F7391;color:#fff">Кетъринг 50%</div></div></div>`;
 if(m.tl)return `<div class="md tl">${m.tl.map(([b,p,bg,fg])=>`<div style="background:${bg};color:${fg}"><b>${b}</b><p>${p}</p></div>`).join('')}</div>`;
 if(m.steps)return `<div class="md steps">${m.steps.map(([b,p],i)=>`<div><span>0${i+1}</span><b>${b}</b><p>${p}</p></div>`).join('')}</div>`;
 if(m.m==='m6'&&/cast/.test(m.i[0][0]))return `<div class="md scat">${m.i.map(([i],k)=>`<div class="f" style="--r:${[-3,2,-1.5,3,-2,1.5][k%6]}deg"><img loading="lazy" src="${I(i)}" alt=""></div>`).join('')}</div>`;
 return `<div class="md ${m.m}">${m.i.map(([i,c])=>`<div class="f"><img loading="lazy" src="${I(i)}" alt="${c}">${c?`<span>${c}</span>`:''}</div>`).join('')}</div>`};
const oc=h=>h.replace(/class="([^"]*)"/g,(m,c)=>'class="'+c.split(/\s+/).filter(Boolean).map(x=>'o-'+x).join(' ')+'"');
const COVS={};O.PAGES.forEach(pg=>{COVS[pg.s[0]==='ads'?'ads':pg.s[0]]=pg});delete COVS.approved;
const covx=id=>{const pg=COVS[id];return pg?`<figure class="covx"><img loading="lazy" src="${I('cov_'+pg.id+'.jpg')}" alt=""><figcaption><small>Тема от стратегията</small><b>${pg.t}</b><span>${pg.d}</span></figcaption></figure>`:''};
const trlCard=()=>`<a class="trl"${TRAILER_URL?` href="${TRAILER_URL}" target="_blank" rel="noopener"`:''}><span class="tp"><img loading="lazy" src="${I('tr_01.jpg')}" alt=""><img loading="lazy" src="${I('tr_06.jpg')}" alt=""><img loading="lazy" src="${I('tr_13.jpg')}" alt=""></span><span class="tt"><small>Екипът одобри трейлъра „Завръщането“.</small><b>Старата Госпожа се връща у дома.</b>${TRAILER_URL?'<em>▶ Гледай в Canva</em>':''}</span></a>`;
const sec=(c,ci,s,j)=>`<section class="sec" id="${s.id}" style="background:#fff">${covx(s.id)}<span class="an">${ci+1}.${j+1} · ${s.t}</span>${s.big?`<p class="bg">${s.big}</p>`:''}${s.h?`<h2>${nbsp(esc(s.h))}</h2>`:''}${s.ln?`<p class="ln">${s.ln}</p>`:''}${s.p?`<div class="pil n${s.p.length}">${s.p.map((x,k)=>Array.isArray(x)?`<div><b>0${k+1}</b><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`:`<div><b>0${k+1}</b><p>${esc(x)}</p></div>`).join('')}</div>`:''}${s.sw?'<div class="sw"><i style="background:#1D3D55"></i><i style="background:#F6DB71"></i><i style="background:#F7F1E3"></i><i style="background:#4F7391"></i></div>':''}${s.acc?`<p class="acc">${s.acc}</p>`:''}${s.pre||''}${media(s)}${s.trl?trlCard():''}${(s.o||[]).map(id=>`<div class="orig">${oc(O.osec(id))}</div>`).join('')}${s.ph?`<div class="md ${s.ph.length>1?'m2':'m1'}">${s.ph.map(([i])=>`<div class="f"><img loading="lazy" src="${I(i)}" alt=""></div>`).join('')}</div>`:''}</section>`;
const PAL=CH.map(c=>[c.tc,c.tf]);
const objs=i=>{const P=[[[.16,.08,.11],[.72,.02,.09]],[[.82,.56,.07],[.25,.68,.09]],[[.6,.1,.1],[.12,.6,.08]],[[.75,.62,.09],[.32,.06,.08]],[[.66,.08,.08],[.18,.66,.1]],[[.78,.58,.08],[.4,.04,.09]]][i];
 return P.map(([x,y,s],k)=>{const [bg,fg]=PAL[(i+k+1)%6];return `<span class="ob" style="left:${x*100}%;top:${y*100}%;--s:${s*100}vw;--bg:${bg};--fg:${fg}"><i></i></span>`}).join('')+`<span class="ob big" style="right:calc(var(--margin) - 1px);top:50%;--s:min(26vw,300px);--bg:${CH[i].tc};margin-top:1px">${gi(CH[i].id)}</span>`};
const stmt=c=>`<section class="stmt sec0" style="--tc:${c.tc};--tf:${c.tf};background:${c.tc}"><h2>${nbsp(c.c)}</h2>${c.d?`<p>${c.d}</p>`:''}${c.cards?`<div class="scards">${c.cards.map(([t,d],k)=>`<div><b>0${k+1}</b><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`:''}</section>`;
const chapter=(c,i)=>`<article class="vw ch" id="v-${c.id}" style="--hc:${c.hc}" hidden><header class="hero ld" style="background:#14202B"><span class="hl" style="top:50%"></span><span class="hl" style="top:12%"></span><span class="hl" style="top:84%"></span><span class="vl" style="left:calc(var(--c2) - 61px)"></span><span class="vl" style="right:var(--margin)"></span>${objs(i)}<h1>${c.t}</h1><p class="k"><span>Глава 0${i+1}</span><span>${c.s.length} точки</span><span>Скролни ↓</span></p></header>${stmt(c)}${c.s.map((s,j)=>sec(c,i,s,j)).join('')}${CH[i+1]?`<a class="nx" href="#/${CH[i+1].id}" data-go="${CH[i+1].id}" style="--tc:${CH[i+1].tc};--tf:${CH[i+1].tf}"><small>Следваща тема · 0${i+2}</small><h2>${CH[i+1].t}</h2><div class="vis">${gi(CH[i+1].id)}</div></a>`:`<a class="nx" href="#/" data-home style="--tc:#4F7391;--tf:#F7F1E3"><small>Край</small><h2>Всички теми</h2></a>`}</article>`;
const app=document.getElementById('app');app.innerHTML=CH.map(chapter).join('');
{const mp=document.querySelector('#niche .orig svg[aria-label="Карта на пазара по наша преценка"]'),pl=document.querySelector('#niche .pil');if(mp&&pl){const f=document.createElement('figure');f.className='nmap';f.appendChild(mp);pl.before(f);document.querySelectorAll('#niche .orig p.cap,#niche .orig p.o-cap').forEach(x=>{if(/наша преценка/.test(x.textContent))x.remove()})}}
/* махаме повторенията: същото заглавие или същата снимка два пъти в една секция */
document.querySelectorAll('.sec').forEach(sc=>{const h=sc.querySelector(':scope>h2');const norm=t=>t.toLowerCase().replace(/[^a-zа-яѝ0-9]+/g,''),W=t=>new Set(t.toLowerCase().split(/[^a-zа-яѝ0-9]+/).filter(w=>w.length>2)),sim=(a,b)=>{const A=W(a),B=W(b);let n=0;A.forEach(w=>B.has(w)&&n++);return n/Math.max(1,Math.min(A.size,B.size))};
 const st=sc.closest('.vw')?.querySelector('.stmt h2');if(st)sc.querySelectorAll('.orig h1,.orig h2').forEach(x=>{if(norm(x.textContent)===norm(st.textContent))x.remove()});
 if(h)sc.querySelectorAll('.orig h1,.orig h2').forEach(x=>{if(norm(x.textContent)===norm(h.textContent)||sim(x.textContent,h.textContent)>=.6)x.remove()});
 const seen=new Set([...sc.querySelectorAll('.orig img')].map(i=>i.getAttribute('src')));
 sc.querySelectorAll(':scope>.md .f').forEach(f=>{const i=f.querySelector('img');if(i&&seen.has(i.getAttribute('src')))f.remove()});
 sc.querySelectorAll(':scope>.md').forEach(m=>{if(m.matches('.m1,.m2,.m3,.m4,.m5,.m6,.m8')&&!m.children.length)m.remove()});
 const all=new Set();sc.querySelectorAll('.orig img').forEach(i=>{const k=i.getAttribute('src');if(all.has(k)){const f=i.closest('.o-pic,figure');(f||i).remove()}else all.add(k)})});
/* state */
const navc=document.getElementById('navc'),rail=document.getElementById('rail'),rt=document.getElementById('rt'),pr=document.getElementById('pr'),os=document.getElementById('os'),intro=document.getElementById('intro');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;let cur=null;
function openNav(){navc.classList.add('open','warp');app.inert=true;document.body.style.overflow='hidden';rt.style.opacity=0;setTimeout(()=>navc.classList.remove('warp'),600)}
function closeNav(){if(!cur)return;navc.classList.remove('open');app.inert=false;document.body.style.overflow='';setTimeout(()=>rt.style.opacity=1,100)}
function showCh(id){cur=id;navc.classList.add('snap');setTimeout(()=>navc.classList.remove('snap'),80);document.body.classList.add('inch');rail.hidden=false;document.querySelectorAll('.vw').forEach(v=>v.hidden=v.id!=='v-'+id);const c=CH.find(x=>x.id===id);rt.textContent=c.t;
 navc.classList.remove('open','close');document.querySelectorAll('.nt').forEach(t=>t.classList.remove('enlarge'));app.inert=false;document.body.style.overflow='';rt.style.opacity=1;scrollTo(0,0);
 const h=document.querySelector('#v-'+id+' .hero');h.classList.add('ld');const L=[...h.querySelectorAll('.hl')],V=[...h.querySelectorAll('.vl')],O=[...h.querySelectorAll('.ob')];
 [...L,...V,...O].forEach(e=>{e.style.transition='none';e.style.background='#fff'});void h.offsetWidth;h.classList.remove('ld');
 const an=(e,d)=>{e.style.transition=`transform .7s ${d}ms cubic-bezier(.6,0,.6,1),opacity .7s ${d}ms cubic-bezier(.6,0,.6,1),background-color .3s ${d+400}ms ease-in-out`;e.style.background=''};
 L.forEach((e,k)=>an(e,k*200));V.forEach((e,k)=>an(e,k*200+100));O.forEach((e,k)=>an(e,k*80+160));sync()}
function goHome(){cur=null;document.body.classList.remove('inch');rail.hidden=true;document.querySelectorAll('.vw').forEach(v=>v.hidden=true);navc.classList.add('open');navc.classList.remove('close');document.querySelectorAll('.nt').forEach(t=>t.classList.remove('enlarge'));document.body.style.overflow='hidden'}
function route(){const h=location.hash.replace(/^#\/?/,'');if(CH.some(c=>c.id===h))showCh(h);else goHome()}
/* същата тема: hashchange няма да дойде, затова отваряме ръчно */
function nav(id){if(location.hash.replace(/^#\/?/,'')===id)showCh(id);else location.hash='/'+id}
function go(id,tileEl){const nt=tileEl&&tileEl.closest('.nt');
 if(!nt||innerWidth<=991||RM||!navc.classList.contains('open')){nav(id);return}
 const tt=nt.querySelector('.ttl'),fs=parseFloat(getComputedStyle(tt).fontSize),k=Math.min(innerWidth*.09,180)/fs,h=fs*.95,top0=18+22,x0=60+(innerWidth-60-240-11*24)/12+24+120;tt.style.setProperty('--tt2',`translate(${x0-18}px,${innerHeight/2-top0-h/2-h*k/2}px) scale(${k})`);navc.classList.add('close');nt.classList.add('enlarge');setTimeout(()=>nav(id),600)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go,g);return}
 if(e.target.closest('[data-home]')){e.preventDefault();location.hash='/';return}
 if(e.target.closest('#mbtn')){if(!cur)return;navc.classList.contains('open')?closeNav():openNav()}});
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur){navc.classList.contains('open')?closeNav():openNav()}
 if(!cur&&/^[1-6]$/.test(e.key))go(CH[+e.key-1].id,document.querySelector('.t'+e.key+' .tile'));
 if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});
/* rail colour + progress */
function sync(){if(!cur)return;const v=document.getElementById('v-'+cur);const max=document.documentElement.scrollHeight-innerHeight;const p=max>0?scrollY/max:0;
 pr.style.transform=innerWidth<=991?`scaleX(${p})`:`scaleY(${p})`;let s=null;v.querySelectorAll('.hero,.stmt,.sec,.nx').forEach(x=>{const r=x.getBoundingClientRect();if(r.top<=innerHeight/2&&r.bottom>=innerHeight/2)s=x});
 if(s){const bg=getComputedStyle(s).backgroundColor;rail.style.backgroundColor=bg;const [r,g,b]=bg.match(/\d+/g).map(Number);rail.classList.toggle('on-light',(0.2126*r+0.7152*g+0.0722*b)/255>0.5)}}
addEventListener('scroll',()=>requestAnimationFrame(sync),{passive:true});
/* overscroll opens mosaic */
let acc=0,last=0;addEventListener('wheel',e=>{if(!cur||navc.classList.contains('open'))return;const max=document.documentElement.scrollHeight-innerHeight;
 if(scrollY>=max-2&&e.deltaY>0){acc=Math.min(1500,acc+e.deltaY);last=Date.now()}else acc=0;os.style.setProperty('--op',Math.min(1,acc/1500));if(acc>=1500){acc=0;os.style.setProperty('--op',0);openNav()}},{passive:true});
setInterval(()=>{if(acc>0&&Date.now()-last>60){acc=Math.max(0,acc-60);os.style.setProperty('--op',Math.min(1,acc/1500))}},30);
/* intro */
const endIntro=()=>{if(intro.classList.contains('out'))return;intro.classList.add('out');setTimeout(()=>intro.remove(),1200);if(!cur){navc.classList.add('open')}};
route();
if(cur||RM){intro.remove();}else{navc.classList.remove('open');intro.addEventListener('click',endIntro);addEventListener('wheel',endIntro,{once:true,passive:true});addEventListener('touchmove',endIntro,{once:true,passive:true});addEventListener('keydown',endIntro,{once:true});setTimeout(endIntro,2600)}
</script>
