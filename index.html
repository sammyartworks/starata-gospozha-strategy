<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Старата Госпожа</title>
<meta name="description" content="Стратегия на Moshe Agency за Старата Госпожа, ноември 2026 до януари 2027">

<style>
/* Moshe Agency x Старата Госпожа. Нощно синьо, жълтък, крем и бордо като червилото ѝ. Oswald за заглавията, Montserrat за текста. */
:root{--paper:#fff;--cream:#F7F1E3;--ink:#1C1C1E;--mid:#5E5A55;--navy:#1D3D55;--yolk:#F6DB71;--bordo:#7A1E2C;--line:#E6DFD0;--serif:'Oswald','Arial Narrow',sans-serif;--sans:'Montserrat',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6}
h1,h2,h3,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--bordo);outline-offset:2px}
a{color:var(--bordo);font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{padding-block:72px;display:flex;flex-direction:column;gap:40px}

/* Типография */
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.08;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(40px,5.4vw,72px)}
h2{font-size:clamp(30px,3.4vw,46px);max-width:24ch}
h3{font-size:20px;font-weight:700;line-height:1.3}
.h3l{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.eb{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bordo)}
.lead{font-size:clamp(19px,1.6vw,23px);color:var(--mid);max-width:60ch;line-height:1.5}
.head{display:flex;flex-direction:column;gap:12px}
.cap{font-size:16px;color:var(--mid);max-width:80ch}
.q{font-family:var(--sans);font-style:italic;font-weight:600;font-size:clamp(17px,1.4vw,20px);line-height:1.35}
.big{font-family:var(--serif);font-size:36px;line-height:1}

/* Блокове */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.pic{position:relative;border-radius:4px;overflow:hidden;background:var(--cream)}
.tag{position:absolute;right:10px;bottom:10px;z-index:2;font-size:13px;color:#fff;background:rgba(28,28,30,.6);padding:3px 9px;border-radius:99px}
.r34{aspect-ratio:3/4}.r11{aspect-ratio:1}.r169{aspect-ratio:16/9}.r45{aspect-ratio:4/5}
.list{display:flex;flex-direction:column}
.list li{padding:14px 0;border-bottom:1px solid var(--line);font-size:19px;font-weight:500}
.g2,.g3,.g4,.g5,.g6{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(6,minmax(0,1fr))}.g5>*{grid-column:span 2}.g5>:nth-child(n+4){grid-column:span 3}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--cream);border-radius:4px;padding:26px 28px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{color:var(--mid);font-size:17px}
.card.b{background:var(--navy);color:#fff}.card.b p{color:#E3EAEF}
.card.n{background:var(--navy);color:#fff}.card.n p{color:#E3EAEF}
.soft{background:var(--cream)}.soft .card{background:#fff}.soft .card.b,.soft .card.n{background:var(--navy)}
.band{background:var(--navy);color:#fff}.band .eb{color:var(--yolk)}.band .lead{color:#DCE5EB}
.bandb{background:var(--bordo);color:#fff}.bandb .eb{color:var(--yolk)}.bandb .card.n{background:rgba(0,0,0,.22)}
.tile{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile p{color:var(--mid);font-size:17px}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 32px}.qs .q:nth-child(3n+1){color:var(--yolk)}
.mosaic{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.mosaic .pic{grid-column:span 4;aspect-ratio:4/5}
.av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--ink);flex:none;border:3px solid #fff;box-shadow:0 0 0 1px var(--bordo)}
.comp{display:flex;gap:16px;align-items:center}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{background:var(--cream);border-radius:4px;padding:16px 20px;font-weight:500;font-size:17px;line-height:1.35}
.soft .chip{background:#fff}
.chip.hi{background:var(--navy);color:#fff}
.castg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}.castg figure{margin:0;display:flex;flex-direction:column;gap:8px}.castg img{aspect-ratio:4/5;height:auto;border-radius:4px}.castg figcaption{font-weight:600;font-size:17px}
.ill{margin:0;border-radius:6px;overflow:hidden;aspect-ratio:2/1;background:var(--cream)}.ill img{object-fit:cover}
.phg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}.phg figure{margin:0;display:flex;flex-direction:column;gap:8px}.phg img{aspect-ratio:1;height:auto;border-radius:4px}.phg figcaption{font-size:15px;font-weight:500;line-height:1.35}
.phone{width:min(300px,100%);margin:0 auto;background:#fff;border:10px solid #1C1C1E;border-radius:34px;padding:22px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.15)}.ph-top{font-size:13px;font-weight:700;color:var(--mid)}.ph-t{font-family:var(--serif);font-size:24px;text-transform:uppercase;line-height:1.1;color:var(--navy)}.phone label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--mid)}.phone label span{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink)}.ph-b{background:var(--navy);color:#fff;text-align:center;border-radius:99px;padding:12px;font-weight:700;margin-top:6px}
.g2.one{grid-template-columns:minmax(0,1fr)}
.chips4{grid-template-columns:repeat(4,minmax(0,1fr))}.chips2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.tl>div{border-top:3px solid var(--bordo);padding-top:16px;display:flex;flex-direction:column;gap:8px}
.tl .t{font-family:var(--serif);font-weight:500;font-size:30px;text-transform:uppercase}
.tl p{color:var(--mid)}.tl p.k{color:var(--bordo);font-weight:700}.tl p.r{color:var(--ink);font-weight:600}
.bar{display:grid;grid-template-columns:220px 1fr 80px;gap:16px;align-items:center;font-weight:500;font-size:17px}
.bar i{display:block;height:26px;border-radius:2px}
.total{font-family:var(--serif);font-size:40px;color:var(--bordo);margin-top:6px}
.sb{display:flex;flex-direction:column;gap:12px;padding-block:26px;border-top:1px solid var(--line)}
.sbh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.sbx{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}.sbw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.strip{height:340px;width:auto;max-width:none;border-radius:4px}
.shots{display:flex;flex-direction:column;gap:6px;flex:1;min-width:240px}
.shots li{font-size:17px;font-weight:500}.shots b{color:var(--bordo);margin-right:6px}
.trg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 14px}
.trg p{font-size:16px;font-weight:500}.trg b{color:var(--bordo)}
.mb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mb img{aspect-ratio:4/5;width:100%;height:auto;object-fit:cover;border-radius:4px;background:var(--cream)}
.mb.n9{grid-template-columns:repeat(5,minmax(0,1fr))}
.stmt h1{font-size:clamp(34px,4.2vw,56px);max-width:22ch}

/* Навигация */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;height:64px}
.brand{font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center}
.tn{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}.tn::-webkit-scrollbar{display:none}
.tn button:first-child{margin-left:auto}.tn button:last-child{margin-right:auto}
.tn button{white-space:nowrap;padding:8px 12px;border-radius:99px;font-weight:600;font-size:14px;flex:none}
.tn button:focus-visible{outline-offset:-3px}
.tn button:hover{background:var(--cream)}.tn button.on{background:var(--navy);color:#fff}
.prog{position:absolute;bottom:-1px;left:0;height:2px;background:var(--bordo);width:0}

/* Корици */
.hero,.cov{position:relative;display:flex;align-items:flex-end;color:#fff;background:var(--navy);overflow:hidden}
.hero{min-height:70vh}.hero.home{min-height:calc(100vh - 64px)}
.cov{scroll-margin-top:64px}
.hero>img{position:absolute;inset:0;object-position:center 40%}.cov{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:stretch}.cov:after{display:none}.cov>img{grid-column:2;grid-row:1;width:100%;height:100%;min-height:100%;aspect-ratio:16/9;object-fit:cover;align-self:stretch}.cov .wrap{grid-column:1;grid-row:1;justify-content:flex-end;padding-left:max(24px,calc((100vw - 1320px)/2 + 24px));padding-right:40px}
.hero:after,.cov:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,32,44,.92) 0,rgba(18,32,44,.8) 45%,rgba(18,32,44,.2) 85%)}
.hero .wrap,.cov .wrap{position:relative;z-index:1;width:100%;padding-block:56px;display:flex;flex-direction:column;gap:14px}
.hero .eb,.cov .eb{color:var(--yolk)}.hero .lead,.cov .lead{color:#F1EDE4}
.cov h1{font-size:clamp(40px,4.4vw,72px)}
.tick{background:var(--bordo);color:#fff;overflow:hidden;white-space:nowrap;font-family:var(--serif);font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding-block:14px}
.tick div{display:inline-block;animation:tk 60s linear infinite}
.tick span{margin-right:56px}
@keyframes tk{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick div{animation:none}}

/* Лента на темата */
.pt{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:10;background:var(--navy);color:#fff}
.pt .wrap{display:flex;align-items:baseline;gap:16px;padding-block:11px}
.pn{font-family:var(--serif);font-size:24px;color:var(--yolk);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc{font-size:14px;color:#B9C7D1}
.ptt{font-size:19px;font-weight:700;line-height:1.2}
.pm{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.ptw .chap{scroll-margin-top:120px}

.foot{background:var(--ink);color:#fff;padding-block:32px}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-weight:600;font-size:16px}

@media (max-width:1180px){.brand{display:none}}
@media (max-width:1100px){.g6,.castg,.phg{grid-template-columns:repeat(3,minmax(0,1fr))}.mb,.mb.n9{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.g5>*,.g5>:nth-child(n+4){grid-column:auto}.split,.g3,.g4,.g5,.g2,.qs,.tl,.chips,.chips4,.chips2{grid-template-columns:minmax(0,1fr)}.g6,.trg{grid-template-columns:repeat(2,minmax(0,1fr))}.mosaic .pic{grid-column:span 6}.strip{height:240px}.bar{grid-template-columns:1fr 70px}.bar i{grid-column:1/3;grid-row:2}.mb:not(.n9){grid-template-columns:repeat(2,minmax(0,1fr))}.page{gap:32px;padding-block:52px}.cov{grid-template-columns:minmax(0,1fr)}.cov>img{grid-column:1}.cov .wrap{grid-column:1;grid-row:2;padding-inline:24px;padding-block:32px 40px}.pt .wrap{gap:12px;padding-block:9px}.pc{display:none}}
</style>
</head>

['DH6b9idxPHY','Общо','Брандов филм','@friendofafarmer','https://www.instagram.com/reel/DH6b9idxPHY/','Кратка кино история на мястото. Водещата референция за новия брандов филм.',['Фасада с името от светлина','Залата преди гостите','Бухтите в тигана','Ръка поръсва пудра','Сметка с бележка от нея']],
['Dd0_01UlWkB','Общо','Коледа в града','@jomalonelondon','https://www.instagram.com/reel/Dd0_01UlWkB/','Елхи по емблематични места, като колаж. Сменяме Лондон със София.',['Колаж: елха пред Народния театър','Колаж: елха на жълтите павета','Бележки вместо играчки','Фасадата на Оборище','Вратата се отваря']],
['p1','Оборище','Бележките','Pinterest','https://www.pinterest.com/pin/1100989440172589742/','Една бележка обикаля квартала и стига до масата. Първият етап, загадката.',['Ръка лепи бележка на вратата','Бележка в Докторската','Бележка на масата','Чинията влиза в кадър','Подпис: Госпожата']],

['vision','Модерна ретро София',()=>page(head('','Стара София през днешен обектив','Днешна елегантност, която помни стара София. Естествена светлина, апетитни близки кадри, истински хора и малки следи от Госпожата.')+`<div class="mosaic">${['buhti_macro.jpg','coffee.jpg','table1.jpg','neon.jpg','p104.jpg','bar.jpg','cappuccino.jpg','p98.jpg'].map(i=>pic(i,'Снимка от архива на Старата Госпожа')).join('')}</div>`+cards([['Оборище','Детайли, близки композиции, текстури, история и бохемско усещане. Цвят на адреса: синьо.'],['Витоша','Широки кадри, хора, пространство, общуване и движение. Цвят на адреса: жълто.','b']],'g2')+`<div class="g3"><div class="card" style="background:#1D3D55;color:#fff"><h3>Нощно синьо</h3><p style="color:#fff">#1D3D55, сегашният цвят на бранда</p></div><div class="card" style="background:#F6DB71"><h3>Жълто като жълтък</h3><p style="color:#1C1C1E">#F6DB71, за нещата, които се помнят</p></div><div class="card" style="background:#F7F1E3;border:1px solid #E6DFD0"><h3>Крем</h3><p style="color:#1C1C1E">#F7F1E3, фон за храна и менюта</p></div></div><p class="cap">Акцент: бордо като червилото ѝ. Палитрата и шрифтовете съгласуваме с настоящата визия на бранда.</p>`)],

['merge','Защо един профил',()=>page(head('','Всички гости на една маса','Едни последователи, едно име, един рекламен бюджет. Двата адреса пазят своя характер чрез ясен ред в профила.')+cards([['Един дом','Едно име и един акаунт в Instagram, една страница във Facebook. Биото съдържа двата адреса.'],['Ред за двата адреса','Всеки пост има геотаг, цветен етикет (синьо за Оборище, жълто за Витоша) и адреса на първия ред. Така един профил остава подреден.','b'],['Highlights за всяка локация','Най-горе в профила има Highlights (запазени сторита). Отделен за Оборище и за Витоша, с адреса, работното време и снимки от мястото, плюс Меню, Кетъринг и Клубът. Новият последовател намира всичко за секунди.']],'g3')+tl([['Седмица 1','Обявяваме сливането едновременно от двата профила и каним хората да последват основния.'],['Седмица 2','Основният профил вече публикува и за двата адреса, а вторият само насочва към него.'],['Седмици 3 и 4','Напомняне и закачено съобщение. После вторият профил се архивира с писмено съгласие.']])+pic('h_bigtable.jpg','Концепция: една дълга маса','r169',AI)+`<p class="cap">В Instagram последователите минават сами, един по един, затова преминаването трябва да изглежда като новина и да носи подарък. Facebook страниците се сливат със заявка към Meta, ако бъде одобрена.</p>`,'soft')],
['comeback','Трейлър: Завръщането',()=>page(head('','Старата Госпожа се връща','Ретро автомобил довежда аристократична дама обратно в нейното заведение. Тя мълчи, а лицето ѝ остава скрито до края. Финален надпис: „Най-хубаво е у дома.“')+cards([['Формат','20 до 25 секунди, 9:16 за Reels и TikTok, плюс версия 4:5. Забавени кадри, топла визия, музика без реплики.'],['Цел','Сливането на профилите да звучи като голяма новина, а не като техническа промяна. Така хората го забелязват и последват новия профил.'],['Локация','Пристига на Оборище 18, където е започнало всичко. Витоша 119 е втората спирка.'],['Героинята','Шапка клош, дълги перли, бели ръкавици, черна коприна, тъмночервени устни.','b']],'g4')+`<div class="trg">${SHOTS.map((t,i)=>`<div class="tile"><div class="pic"><img loading="lazy" src="${I('tr_'+String(i+1).padStart(2,'0')+'.jpg')}" alt="Кадър ${i+1}: ${t}" style="aspect-ratio:4/3;height:auto"></div><p><b>${i+1}</b> ${t}</p></div>`).join('')}</div><div class="pic"><img loading="lazy" src="${I('tr_13.jpg')}" alt="Финален надпис на трейлъра" style="aspect-ratio:16/7;height:auto"></div><p class="cap">Наемът на автомобила и реквизитът са за сметка на ресторанта.</p>`)],
['announce','Анонсът и денят',()=>page(head('','Обединяването става голямо завръщане','Всичко ново у Госпожата излиза в една новина през декември.')+tl([['Тийзър, 5 дни','Три снимки със следи от Госпожата: бележки и бижута около храната. Ръката ѝ събира багаж: „Старата Госпожа кани всички на едно място.“'],['Денят','Броят „Какво е ново у Госпожата“, трейлърът, скеч, в който тя сдобрява двете сестри Оборище и Витоша, и карусел „Какво се променя и какво остава“.'],['4 седмици томбола','Томбола „Брънч за двама с Госпожата“. 4 седмици, всяка седмица една награда. Условието е да последваш новия профил и да отбележиш приятел в коментар. Носи и нови последователи, не само преминаване от стария профил.']])+`<p class="q">„Досега Госпожата живееше в два профила. От днес е на едно място в телефона ви и на две в града: Оборище 18 и Витоша 119.“</p>`+sub('Още за деня на събирането')+cards([['Вестникът на Госпожата','Неделя, вестник, кафе. На първа страница: новият шеф, витрината, кетърингът и „Клубът отваря през януари“. Референция: '+A('https://www.pinterest.com/pin/904942118887023165/','Pinterest')+'.','b'],['BREAKING NEWS у Госпожата','Новинарски формат с лента отдолу и сериозен тон, за сливането и новото меню. Референция: '+A('https://www.instagram.com/reel/DapYTNvsyXL/','fab33.bistro')+'.'],['Pretty Woman на Витошка','Две кокетни баби пазаруват по Витошка и завършват при Госпожата: „Където денят започва и завършва добре.“'],['Стори с въпрос','Анкета в сторита „От коя маса сте: Оборище или Витоша?“. Хората отговарят и така свикват, че двата адреса са в един профил.'],['Видео от екипа','Кратко видео, в което хората от двата адреса заедно поздравяват последователите в новия профил.']],'g3'),'soft')],

['clubhow','Как го пускаме',()=>page(head('','Клубът отваря през януари')+tl([['Декември','Тийзър в новината за сливането: „Госпожата прави списък с любимите си внуци.“'],['Тих старт','Две седмици само с редовните гости и екипа, за да изчистим грешките. На касата едно изречение: „Член ли сте на клуба?“'],['Януари','Публичен старт с „Доведи баба си“, Reel, TikTok и QR на масите. Първите 100 членове получават двоен печат.']])+cards([['Стартът: Доведи баба си','Ден, в който всеки, който дойде с баба си, получава отстъпка. Фотограф снима за мрежите и с апарат за моментални снимки, а снимките остават у гостите за спомен.','b'],['Филмът на клуба','Две баби в градината на Витоша поръчват брънч. При първата хапка стават млади девойки като от стара лента, вдигат наздравица и пак са баби: „Ммм, брънч като едно време.“']],'g2')+`<p class="cap">Агенцията дава идеята и комуникацията. Организацията на събитието, фотографът и отстъпките са на ресторанта. Касовата система, кодът в сайта и печатната карта са с анекс или от вашия доставчик.</p>`)],

const ILL={idea:'Обща маса, ръцете на всички около бухтите',voice:'Гласът на Госпожата',tone:'Бележката до Бенедикта',reveal:'Госпожата в гръб на входа',merge:'Синята и жълтата маса стават една',announce:'Вестникът на Госпожата',club:'Печат в картата',levels:'Креслото на почетния пенсионер',clubhow:'Баби и внучка на брънч',cater2:'Госпожата носи обяда на срещата',adscater:'Кутиите за офиса',content:'Масата като снимачна площадка',tiktok:'Госпожата посяга към бухтите',tags:'Огледалото на Госпожата',approved:'Одобрените идеи на масата',ads:'Две равни половини',shoots:'Снимачен ден',days:'Първите 90 дни',kpi:'Госпожата си води сметка',fixfirst:'Уикенд сутрин пред вратата',annex:'Картите, табелите и кутиите'};
const ill=id=>`<figure class="ill"><img loading="lazy" src="${I('ill_'+(id==='cater2'?'cater':id)+'.jpg')}" alt="Илюстрация: ${ILL[id]}"></figure>`;
const sec=id=>{let h=byId(id)[2]().replace('<section class="chap','<section id="'+id+'" class="chap');if(!ILL[id])return h;const m=h.match(/<div class="head">(?:(?!<div)[\s\S])*?<\/div>/);return m?h.replace(m[0],m[0]+ill(id)):h.replace('<div class="wrap page">','<div class="wrap page">'+ill(id));};
const TICK=['Госпожата знае най-добре','Госпожата събира всички','Два адреса. Една Госпожа.','Перлите са по желание. Бухтите са задължителни.','Първо хапни, после ще говорим'];
const t=TICK.map(x=>`<span>${x}</span>`).join('');
const intro=hero('h_cafe.jpg','Концепция: Госпожата на кафе на софийска тераса','','Старата Госпожа','От познато брънч място към любим повод да се събираме.',AI).replace('chap hero','chap hero home').replace('loading="lazy" ','')+`<div class="tick" aria-hidden="true"><div>${t+t+t+t}</div></div>`+page(`<div class="head"><h1>Госпожата събира всички. И знае най-добре.</h1><p class="lead">Сменяме гласа на ресторант с гласа на героиня: с мнение, обноски и остър език. Три фокуса: един профил, Клубът на пенсионера и кетърингът.</p></div>`,'stmt');
const chapter=(p,i)=>`<section class="cov" id="${p.id}"><img loading="lazy" src="${I('cov_'+p.id+'.jpg')}" alt=""><div class="wrap"><p class="eb">Тема ${i+1} от ${PAGES.length}</p><h1>${p.t}</h1><p class="lead">${p.d}</p></div></section>`+p.s.map((id,j)=>`<div class="ptw"><div class="pt"><div class="wrap"><span class="pn">${i+1}.${j+1}</span><div class="pm"><p class="pc">${p.t}</p><h2 class="ptt">${byId(id)[1]}</h2></div></div></div>${sec(id)}</div>`).join('');
m.innerHTML=intro+PAGES.map(chapter).join('')+sec('end');
const SHORT={'brand':'Начало','concept':'Един профил','community':'Клубът','catering-page':'Кетъринг','team':'Концепции','plan':'Бюджет','competitors':'Пазарът'};
tn.innerHTML=PAGES.map(p=>`<button data-to="${p.id}">${SHORT[p.id]||p.t}</button>`).join('');
const heads=PAGES.map(p=>document.getElementById(p.id));
function track(){const max=document.documentElement.scrollHeight-innerHeight;pg.style.width=(max>0?scrollY/max*100:0)+'%';let c=-1;heads.forEach((e,i)=>{if(e.getBoundingClientRect().top<=130)c=i});if(c<0)tn.scrollLeft=0;tn.querySelectorAll('button').forEach((b,i)=>{const on=i==c;if(on&&!b.classList.contains('on'))tn.scrollLeft=b.offsetLeft-tn.clientWidth/2+b.clientWidth/2;b.classList.toggle('on',on)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(b)document.getElementById(b.dataset.to).scrollIntoView()});
addEventListener('scroll',track,{passive:true});addEventListener('resize',track);track();
</script>
</body>
</html>
