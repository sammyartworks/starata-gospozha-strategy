<style>
/* Moshe Agency x Старата Госпожа. Нощно синьо, жълтък, крем и бордо като червилото ѝ. Oswald за заглавията, Montserrat за текста. */
:root{--paper:#fff;--cream:#F7F1E3;--ink:#1C1C1E;--mid:#5E5A55;--navy:#1D3D55;--yolk:#F6DB71;--bordo:#7A1E2C;--line:#E6DFD0;--serif:'Oswald','Arial Narrow',sans-serif;--sans:'Montserrat',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:auto}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6}
h1,h2,h3,p,ul,ol{margin:0;padding:0}ul,ol{list-style:none}
img{display:block;width:100%;height:100%;object-fit:cover}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--bordo);outline-offset:2px}
a{color:var(--bordo);font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.page{padding-block:56px;display:flex;flex-direction:column;gap:36px}

/* Типография */
h1,h2{font-family:var(--serif);font-weight:600;line-height:1.08;letter-spacing:.005em;text-transform:uppercase;text-wrap:balance}
h1{font-size:clamp(40px,5.4vw,72px)}
h2{font-size:clamp(30px,3.4vw,46px);max-width:24ch}
h3{font-size:20px;font-weight:700;line-height:1.3}
.h3l{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em}
.eb{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bordo)}
.lead{font-size:clamp(19px,1.6vw,23px);color:var(--mid);max-width:60ch;line-height:1.5}
.head{display:flex;flex-direction:column;gap:12px}
.cap{font-size:16px;color:var(--mid);max-width:80ch}

.big{font-family:var(--serif);font-size:36px;line-height:1}

/* Блокове */
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}

.g2,.g3,.g4,.g5,.g6{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(6,minmax(0,1fr))}.g5>*{grid-column:span 2}.g5>:nth-child(n+4){grid-column:span 3}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--cream);border-radius:4px;padding:26px 28px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card p{color:var(--mid);font-size:17px}
.card.b{background:var(--navy);color:#fff}.card.b p{color:#E3EAEF}
.card.n{background:var(--navy);color:#fff}.card.n p{color:#E3EAEF}

.band{background:var(--navy);color:#fff}.band .eb{color:var(--yolk)}.band .lead{color:#DCE5EB}
.bandb{background:var(--bordo);color:#fff}.bandb .eb{color:var(--yolk)}.bandb .card.n{background:rgba(0,0,0,.22)}
.tile{display:flex;flex-direction:column;gap:10px;min-width:0}

.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 40px}.qs .q:nth-child(3n+1){color:var(--yolk)}

.av{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--ink);flex:none;border:3px solid #fff;box-shadow:0 0 0 1px var(--bordo)}

.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.chip.hi{background:var(--navy);color:#fff}
.castg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px}.castg figure{margin:0;display:flex;flex-direction:column;gap:8px}.castg img{aspect-ratio:4/5;height:auto;border-radius:4px}.castg figcaption{font-weight:600;font-size:17px}

.g2.one{grid-template-columns:minmax(0,1fr)}
.chips4{grid-template-columns:repeat(4,minmax(0,1fr))}.chips2{grid-template-columns:repeat(2,minmax(0,1fr))}

.band .tl>div:before,.bandb .tl>div:before{background:var(--yolk);box-shadow:0 0 0 6px rgba(246,219,113,.2)}.band .tl>div:after,.bandb .tl>div:after{background:var(--yolk)}
.tl .t{font-family:var(--serif);font-weight:500;font-size:30px;text-transform:uppercase}

.sb{display:flex;flex-direction:column;gap:12px;padding-block:26px;border-top:1px solid var(--line)}
.sbh{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;justify-content:space-between}
.sbx{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}.sbw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.strip{height:280px;width:auto;max-width:none;border-radius:4px}
.shots{display:flex;flex-direction:column;gap:6px;flex:1;min-width:240px}
.shots li{font-size:17px;font-weight:500}.shots b{color:var(--bordo);margin-right:6px}
.trg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 14px}
.trg p{font-size:16px;font-weight:500}.trg b{color:var(--bordo)}
.mb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mb img{aspect-ratio:4/5;width:100%;height:auto;object-fit:cover;border-radius:4px;background:var(--cream)}
.mb.n9{grid-template-columns:repeat(5,minmax(0,1fr))}
.stmt h1{font-size:clamp(34px,4.2vw,56px);max-width:22ch}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.loc{display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--c);padding-top:18px;min-width:0}
.lk{display:flex;align-items:center;gap:10px}.lk i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);flex:none}
.lp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loc>p{color:var(--mid)}
.lt{display:flex;flex-wrap:wrap;gap:6px}.lt li{font-size:14px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff}

.sf{height:280px;border-radius:6px;display:flex;flex-direction:column;justify-content:space-between;padding:20px;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}.sf.d{color:#fff}

.sf b{font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.03em;display:block;line-height:1}

.sw figcaption{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sw figcaption p{color:var(--mid);font-size:16px;line-height:1.45}
.cp{font-size:13px;font-weight:700;color:var(--bordo);padding:4px 0;border-bottom:1px solid currentColor}.cp.ok{color:var(--navy)}
.mix{display:flex;height:16px;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}.mix i{display:block}
.mixl{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:14px;color:var(--mid);margin-top:10px}.mixl span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.fonts>div{background:var(--cream);border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:4px}
.fa{font-size:96px;line-height:1;margin-bottom:12px;color:var(--navy);font-weight:600}

@media (max-width:860px){.sw{grid-template-columns:repeat(2,minmax(0,1fr))}.sf{height:auto;min-height:210px;gap:18px;padding:16px}.sf>div>span{font-size:12px}.sf h3{font-size:21px}.sf b{font-size:22px}.mixl{gap:6px 16px}}
.lg{display:inline-block;width:22px;height:22px;object-fit:contain;vertical-align:-4px;margin-right:10px}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.nc{background:var(--cream);border-radius:6px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.nh{font-weight:700;font-size:18px;display:flex;align-items:center}
.nv{display:flex;flex-direction:column;line-height:1.2}.nv b{font-family:var(--serif);font-weight:500;font-size:34px;color:var(--navy)}.nv span{font-size:15px;color:var(--mid)}
.mg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:48px;align-items:center}
.mgl{display:flex;flex-direction:column;gap:32px}

.pfs{display:flex;flex-direction:column;gap:12px}
.pf{display:flex;align-items:center;gap:12px;font-size:17px}.pf small{display:block;color:var(--mid);font-size:14px}
.pf.one{background:#fff;border-radius:99px;padding:10px 22px 10px 10px;box-shadow:0 2px 14px rgba(0,0,0,.08)}.pf.one b{font-size:19px}
.pa{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:20px}
.arr{font-size:44px;color:var(--bordo);line-height:1}
.why3{counter-reset:w;display:flex;flex-direction:column;gap:18px}

.why3 li:before{content:counter(w);grid-row:span 2;font-family:var(--serif);font-size:34px;line-height:1;color:var(--bordo)}

.phone{background:#fff;border:10px solid var(--ink);border-radius:36px;padding:18px 14px;max-width:340px;justify-self:center;width:100%;box-shadow:0 18px 40px rgba(0,0,0,.15)}
.phh{display:flex;gap:12px;align-items:center;margin-bottom:14px}.phh small{display:block;color:var(--mid);font-size:13px}.phh b{font-size:16px}

.pgr{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.pgr div{aspect-ratio:1;position:relative;background:var(--cream)}
.pgr em{position:absolute;left:5px;top:5px;font-style:normal;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px}
.po em{background:#1D3D55;color:#fff}.pv em{background:#F6DB71;color:#1C1C1E}
.po{background:linear-gradient(135deg,#E3EAEF,#F7F1E3)!important}.pv{background:linear-gradient(135deg,#FBF0C4,#F7F1E3)!important}

/* Един профил: 2 стават 1, телефон, седмици */
.mrg{width:64px;height:120px;flex:none;overflow:visible}.mrg path{fill:none;stroke:var(--bordo);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
