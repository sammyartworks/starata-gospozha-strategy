const m=document.getElementById('m'),pg=document.getElementById('pg'),tn=document.getElementById('tn');
const byId=id=>CH.find(c=>c[0]==id);
const sec=id=>byId(id)[2]().replace('<section class="chap','<section id="'+id+'" class="chap');
const TICK=['Госпожата знае най-добре','Госпожата събира всички','Две локации. Една Госпожа.','Перлите са по желание. Бухтите – не.','Първо хапни, после ще говорим'];
const t=TICK.map(x=>`<span>${x}</span>`).join('');
const intro=hero('h_cafe.jpg','Концепция: Госпожата на кафе на софийска тераса','Moshe Agency · Стратегия','Старата Госпожа','От познато брънч място към любим повод да се събираме.',AI).replace('chap hero','chap hero home')+`<div class="tick" aria-hidden="true"><div>${t+t+t+t}</div></div>`+page(`<div class="head"><h1>Госпожата събира всички. И знае най-добре.</h1><p class="lead">Преминаваме от комуникация на ресторант към комуникация на характер, отношение и преживяване. С два равни приоритета: ресторантите и кетърингът.</p></div>`);
const chapter=(p,i)=>`<section class="cov" id="${p.id}"><img loading="lazy" src="${I('cov_'+p.id+'.jpg')}" alt="${p.t}"><div class="wrap"><p class="eb">Тема ${i+1} от ${PAGES.length}</p><h1>${i+1}. ${p.t}</h1><p class="lead">${p.d}</p></div></section>`+p.s.map((id,j)=>`<div class="ptw"><div class="pt"><div class="wrap"><span class="pn">${i+1}.${j+1}</span><div class="pm"><p class="pc">${p.t}</p><h2 class="ptt">${byId(id)[1]}</h2></div></div></div>${sec(id)}</div>`).join('');
m.innerHTML=intro+PAGES.map(chapter).join('')+sec('end');
const SHORT={'concept':'Концепция','community':'Клуб','plan':'Реклама','team':'Идеи'};
tn.innerHTML=PAGES.map(p=>`<button data-to="${p.id}">${SHORT[p.id]||p.t}</button>`).join('');
const heads=PAGES.map(p=>document.getElementById(p.id));
function track(){const max=document.documentElement.scrollHeight-innerHeight;pg.style.width=(max>0?scrollY/max*100:0)+'%';let c=-1;heads.forEach((e,i)=>{if(e.getBoundingClientRect().top<=140)c=i});tn.querySelectorAll('button').forEach((b,i)=>{const on=i==c;if(on&&!b.classList.contains('on'))tn.scrollLeft=b.offsetLeft-tn.clientWidth/2+b.clientWidth/2;b.classList.toggle('on',on)})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-to]');if(b)document.getElementById(b.dataset.to).scrollIntoView()});
addEventListener('scroll',track,{passive:true});addEventListener('resize',track);track();
</script>
